<!-- Components/checkout-promo/checkout-promo.html -->
<div class="card border rounded-3 p-4">
  <h5 class="fw-bold mb-3"><i class="ti ti-tag me-2"></i>Promo Code</h5>

  <div class="d-flex gap-2">
    <input type="text" class="form-control" placeholder="Enter promo code"
           [(ngModel)]="promoCode" [disabled]="promoApplied" />

    @if (!promoApplied) {
      <button class="btn btn-outline-primary" (click)="apply()"
              [disabled]="isValidating || !promoCode.trim()">
        @if (isValidating) {
          <span class="spinner-border spinner-border-sm"></span>
        } @else {
          Apply
        }
      </button>
    } @else {
      <button class="btn btn-outline-danger" (click)="clear()">Remove</button>
    }
  </div>

  @if (promoApplied) {
    <p class="text-success small mt-2">
      <i class="ti ti-check me-1"></i>
      Promo applied — you save {{ promoDiscount | currency:'EGP' }}
    </p>
  }

  @if (promoError) {
    <p class="text-danger small mt-2">{{ promoError }}</p>
  }
</div>
