<div class="stats-card" [ngClass]="'stats-card--' + color">
  <div class="stats-icon">
    <i class="ti" [class]="'ti ' + icon"></i>
  </div>
  <div class="stats-body">
    <p class="stats-label">{{ label }}</p>
    <h3 class="stats-value">{{ value }}</h3>
    @if (sublabel) {
      <p class="stats-sublabel">{{ sublabel }}</p>
    }
  </div>
</div>
