<header>
  <div class="top-bar">
  <div class="top-bar-left">
    <i class="ti ti-menu-2" style="font-size: 20px; cursor: pointer;"></i>
    <nav class="top-nav">
      <a routerLink="/">Home</a>
      <a href="#">Category <i class="ti ti-chevron-down"></i></a>
      <a href="#">Products <i class="ti ti-chevron-down"></i></a>
      <a href="#">Pages <i class="ti ti-chevron-down"></i></a>
      <a href="#">Blog <i class="ti ti-chevron-down"></i></a>
      <a href="#">Elements <i class="ti ti-chevron-down"></i></a>
    </nav>
  </div>
  <div class="contact">
    <i class="ti ti-phone"></i> +123 (456) (7890)
  </div>
</div>

  <div class="main-bar">
    <div class="brand">
      <img src="Logo.jpg" alt="logo" />
      <div>
        <span class="brand-name">PrimeMarket</span>
        <span class="brand-tagline">Your Online Store</span>
      </div>
    </div>

    <div class="search-bar">
  <input 
    type="text" 
    placeholder="Search for items..." 
    (input)="onSearch($any($event.target).value)" 
  />
  <select>
    <option>All Categories</option>
    <option>Electronics</option>
    <option>Laptops</option>
  </select>
  <button><i class="ti ti-search"></i></button>
</div>

    <div class="actions">
      <a href="#"><i class="ti ti-user"></i> Account</a>
      <a routerLink="/wishlist" style="position: relative;">
        <i class="ti ti-heart"></i> Wishlist
        @if (wishlistCount$ | async; as count) {
          @if (count > 0) {
            <span class="wishlist-badge">{{ count }}</span>
          }
        }
      </a>
      <a routerLink="/cart" style="position: relative;">
        <i class="ti ti-shopping-cart"></i> Cart
        @if (cartCount$ | async; as count) {
          @if (count > 0) {
            <span class="wishlist-badge">{{ count }}</span>
          }
        }
      </a>
    </div>
  </div>
</header>
