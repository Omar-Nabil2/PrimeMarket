<div class="container py-4">

  @if (cart$ | async; as cart) {

    <h2 class="mb-4 fw-bold">
      My Cart
      <span class="fs-6 fw-normal text-muted ms-2">({{ cart.itemCount }} items)</span>
    </h2>

    @if (cart.items.length === 0) {
      <div class="text-center py-5">
        <i class="ti ti-shopping-cart-off" style="font-size: 64px; color: var(--bs-secondary);"></i>
        <h5 class="mt-3 text-muted">Your cart is empty</h5>
        <a routerLink="/" class="btn btn-primary mt-3">Browse Products</a>
      </div>
    } @else {
      <div class="row align-items-start g-4">

        <!-- Items list -->
        <div class="col-12 col-md-8 d-flex flex-column gap-3">
          @for (item of cart.items; track item.id) {
            <app-cart-item-card
              [item]="item"
              (onIncrement)="increment(item.id, item.quantity, item.stock)"
              (onDecrement)="decrement(item.id, item.quantity)"
              (onRemove)="remove(item.id)"
            />
          }
        </div>

        <!-- Order summary -->
        <div class="col-12 col-md-4">
          <app-order-summary [cart]="cart" />
        </div>

      </div>
    }

  } @else {
    <div class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }

</div>
