<div class="brand-location">
  <h3><i class="ti ti-map-pin"></i> Store Location</h3>

  <div class="address">
    <p>{{ brand().street }}</p>
    <p>{{ brand().city }}, {{ brand().country }}</p>
  </div>

  <div class="map-wrapper">
    <iframe
      [src]="getMapUrl()"
      width="100%"
      height="300"
      frameborder="0"
      scrolling="no">
    </iframe>
  </div>
</div>
