<div class="forget-password-container">
  <div class="forget-password-box">
    <!-- Header -->
    <div class="forget-password-header">
      <h1>Reset Password</h1>
      <p>Enter your email to receive a password reset link</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="isSuccess" class="success-alert">
      <i class="ti ti-check-circle"></i>
      <div class="alert-content">
        <h3>Success!</h3>
        <p>{{ successMessage }}</p>
      </div>
    </div>

    <!-- Forget Password Form -->
    <form *ngIf="!isSuccess" [formGroup]="forgetPasswordForm" (ngSubmit)="onSubmit()" class="forget-password-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <i class="ti ti-mail"></i>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
            class="form-input"
            [class.is-invalid]="email?.invalid && email?.touched"
          />
        </div>
        <div *ngIf="email?.invalid && email?.touched" class="error-message">
          <span *ngIf="email?.hasError('required')">Email is required</span>
          <span *ngIf="email?.hasError('email')">Please enter a valid email</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="reset-button"
        [disabled]="forgetPasswordForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading">
          <i class="ti ti-loader-2"></i> Sending...
        </span>
      </button>
    </form>

    <!-- Back to Login Link -->
    <div class="back-to-login">
      <p>Remember your password? <a routerLink="/auth">Back to Login</a></p>
    </div>
  </div>
</div>
